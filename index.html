<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nokia S60 Classic</title>
<style>
/* ============ 基础重置 ============ */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
body { 
  background: #1a1a1a; 
  height: 100vh; 
  height: 100dvh; 
  display: flex; 
  justify-content: center; 
  align-items: center; 
  font-family: 'Tahoma', 'Arial', sans-serif; 
  overflow: hidden; 
}

/* ============ 手机外壳 ============ */
.nokia-phone {
  position: relative; 
  width: 100vw; 
  height: 90dvh; 
  max-width: 380px; 
  max-height: 750px;
  background: #111; 
  display: flex;
  flex-direction: column;
  overflow: hidden; 
  border-radius: 16px; 
  border: 3px solid #333;
  box-shadow: 0 10px 30px rgba(0,0,0,0.9);
}

/* ============ 1. 屏幕区域 ============ */
.screen-container {
  flex: 1; 
  position: relative; 
  display: flex; 
  flex-direction: column; 
  background: #000;
  border-bottom: 2px solid #000;
  overflow: hidden;
}

.status-bar {
  height: 26px; background: #f0f0f0; border-bottom: 1px solid #ccc; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 11px; color: #333; font-weight: bold; flex-shrink: 0; z-index: 10;
}
.sb-left { display: flex; align-items: center; gap: 5px; }
.sb-signal { display: flex; align-items: flex-end; gap: 1px; height: 10px; }
.sb-signal div { width: 3px; background: #333; }
.sb-signal div:nth-child(1) { height: 3px; } .sb-signal div:nth-child(2) { height: 5px; } .sb-signal div:nth-child(3) { height: 7px; } .sb-signal div:nth-child(4) { height: 9px; }
.sb-bat { width: 16px; height: 9px; border: 1px solid #333; padding: 1px; position: relative; }
.sb-bat::after { content: ''; position: absolute; right: -3px; top: 2px; width: 2px; height: 3px; background: #333; }
.sb-bat div { height: 100%; width: 80%; background: #333; }

.views-wrapper { flex: 1; position: relative; }

.view { 
  position: absolute; inset: 0; display: none; flex-direction: column; background: #fff; overflow: hidden; 
}
.view.active { display: flex; }

.softkey-bar {
  height: 34px; background: linear-gradient(180deg, #e0e0e0 0%, #b0b0b0 100%); border-top: 1px solid #999; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 13px; font-weight: bold; color: #333; flex-shrink: 0; margin-top: auto;
}
.sk-btn { cursor: pointer; padding: 5px; }
.sk-btn:active { color: #0050ef; }

/* ============ 待机桌面 ============ */
#home-view { background: radial-gradient(circle at top, #001a66 0%, #00081a 100%); color: #fff; }
.home-top { padding: 10px 15px; display: flex; justify-content: space-between; font-size: 12px; text-shadow: 1px 1px 1px #000; }
.home-clock { text-align: center; text-shadow: 1px 1px 3px #000; margin-top: 15px; }
.home-clock .time { font-size: 52px; font-weight: bold; letter-spacing: 2px; }
.home-clock .date { font-size: 14px; margin-top: 5px; color: #ddd; }

.home-apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 0 20px; margin-top: 40px; }
.home-app { display: flex; flex-direction: column; align-items: center; font-size: 12px; text-shadow: 1px 1px 1px #000; cursor: pointer; outline: none; }
.home-app .icon { width: 44px; height: 44px; border-radius: 8px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); display: flex; justify-content: center; align-items: center; font-size: 20px; margin-bottom: 5px; transition: all 0.1s; }

/* ============ 功能表 ============ */
#menu-view { background: #0050ef; }
.menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 15px 10px; align-content: start; overflow-y: auto; flex: 1;}
.menu-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; outline: none; }
.menu-icon {
  width: 54px; height: 54px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.5);
  display: flex; justify-content: center; align-items: center; font-size: 24px;
  box-shadow: inset 0 1px 2px rgba(255,255,255,0.6), 0 3px 5px rgba(0,0,0,0.4);
  background: linear-gradient(180deg, #fff 0%, #ccc 100%); margin-bottom: 5px; transition: all 0.1s;
}
.menu-text { color: #fff; font-size: 12px; text-shadow: 1px 1px 1px #000; font-weight: bold; }

/* ============ App 视图 ============ */
#app-view { background: #fff; }
.app-title { background: linear-gradient(180deg, #4a4a4a 0%, #222 100%); color: #fff; text-align: center; padding: 8px; font-size: 16px; font-weight: bold; border-bottom: 1px solid #000; flex-shrink: 0;}
.app-content { flex: 1; overflow-y: auto; padding: 10px; font-size: 14px; color: #000; }
.list-item { padding: 12px 5px; border-bottom: 1px solid #ddd; display: flex; align-items: center; gap: 10px; cursor: pointer; outline: none; }

/* 计算器 */
.nokia-calc { display: flex; flex-direction: column; height: 100%; background: #e0e0e0; padding: 5px; }
.calc-display { background: #ccffcc; border: 2px inset #999; padding: 10px; font-family: monospace; font-size: 24px; text-align: right; margin-bottom: 10px; }
.calc-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; flex: 1; }
.calc-btn { background: linear-gradient(180deg, #fff 0%, #ccc 100%); border: 1px solid #999; border-radius: 4px; font-size: 18px; font-weight: bold; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 0 #999; outline: none; }
.calc-btn:active { box-shadow: none; transform: translateY(2px); }

/* ============ 焦点高亮样式 (还原塞班) ============ */
.focused .icon, .focused .menu-icon, .focused.calc-btn, .focused.list-item {
  outline: 2px solid #fff;
  box-shadow: 0 0 12px #fff, inset 0 0 5px rgba(255,255,255,0.8);
  transform: scale(1.08);
  z-index: 5;
}
#menu-view .focused .menu-icon { outline: 2px solid #ffb900; box-shadow: 0 0 12px #ffb900; }
#app-view .focused.list-item { background: #0050ef; color: #fff; }

/* ============ 2. 底部实体键盘区 ============ */
.num-pad {
  height: 240px; background: #1a1a1a; display: flex; flex-direction: column; padding: 8px; flex-shrink: 0;
}
.nav-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 0 5px;}
.nav-ring { 
  width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(180deg, #333 0%, #111 100%); 
  position: relative; box-shadow: inset 0 2px 5px rgba(255,255,255,0.2), 0 5px 10px rgba(0,0,0,0.5); 
  display: flex; justify-content: center; align-items: center; cursor: pointer;
}
.nav-center { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(180deg, #555 0%, #222 100%); border: 1px solid #000; }
.nav-up, .nav-down, .nav-left, .nav-right { position: absolute; color: #aaa; font-size: 10px; pointer-events: none;}
.nav-up { top: 3px; } .nav-down { bottom: 3px; } .nav-left { left: 6px; } .nav-right { right: 6px; }

.softkey { 
  width: 70px; height: 28px; background: linear-gradient(180deg, #333 0%, #111 100%); border-radius: 14px 14px 4px 4px; color: #fff; font-size: 12px; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 1px 2px rgba(255,255,255,0.2); border: 1px solid #000; cursor: pointer;
}
.softkey:active, .softkey.pressed { background: #000; color: #0050ef; }

.key-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; flex: 1; }
.key { 
  background: linear-gradient(180deg, #3a3a3a 0%, #151515 100%); border-radius: 5px; border: 1px solid #000; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 15px; font-weight: bold; box-shadow: 0 2px 2px rgba(0,0,0,0.5); cursor: pointer;
}
.key:active, .key.pressed { background: #000; }
.key span { font-size: 8px; color: #888; margin-top: 1px; font-weight: normal; text-transform: uppercase; }
.key.red { background: linear-gradient(180deg, #5a1a1a 0%, #200); }
.key.green { background: linear-gradient(180deg, #1a5a1a 0%, #020); }

/* 键盘按下动画 */
@keyframes keyPress { 0% { background: #000; } 100% { background: inherit; } }
.pressed-anim { animation: keyPress 0.2s; }

::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<div class="nokia-phone">
  <!-- 1. 屏幕区域 -->
  <div class="screen-container">
    <div class="status-bar">
      <div class="sb-left"><div class="sb-signal"><div></div><div></div><div></div><div></div></div><span>中国移动</span></div>
      <div class="sb-left" style="gap: 8px;"><span>3G</span><div class="sb-bat"><div></div></div></div>
    </div>

    <div class="views-wrapper">
      <!-- 待机桌面 -->
      <div class="view active" id="home-view">
        <div class="home-top"><span>中国移动</span><span>标准</span></div>
        <div class="home-clock">
          <div class="time" id="home-time">10:00</div>
          <div class="date" id="home-date">11月15日 星期日</div>
        </div>
        <div class="home-apps" id="home-apps">
          <div class="home-app" onclick="openApp('messages')"><div class="icon">✉️</div>信息</div>
          <div class="home-app" onclick="openApp('contacts')"><div class="icon">👤</div>通讯录</div>
          <div class="home-app" onclick="openApp('calendar')"><div class="icon">📅</div>日历</div>
          <div class="home-app" onclick="switchView('menu')"><div class="icon">≡</div>功能表</div>
        </div>
        <div class="softkey-bar"><span class="sk-btn" onclick="switchView('menu')">功能表</span><span class="sk-btn">通讯录</span></div>
      </div>

      <!-- 功能表 -->
      <div class="view" id="menu-view">
        <div class="menu-grid" id="menu-grid">
          <div class="menu-item" onclick="openApp('messages')"><div class="menu-icon" style="background: linear-gradient(180deg,#fff,#0f0)">✉️</div><div class="menu-text">信息</div></div>
          <div class="menu-item" onclick="openApp('contacts')"><div class="menu-icon" style="background: linear-gradient(180deg,#fff,#ff0)">👤</div><div class="menu-text">通讯录</div></div>
          <div class="menu-item" onclick="openApp('calendar')"><div class="menu-icon" style="background: linear-gradient(180deg,#fff,#f00)">📅</div><div class="menu-text">日历</div></div>
          <div class="menu-item" onclick="openApp('music')"><div class="menu-icon" style="background: linear-gradient(180deg,#fff,#0ff)">🎵</div><div class="menu-text">音乐</div></div>
          <div class="menu-item" onclick="openApp('calc')"><div class="menu-icon" style="background: linear-gradient(180deg,#fff,#aaa)">🔢</div><div class="menu-text">计算器</div></div>
          <div class="menu-item" onclick="openApp('settings')"><div class="menu-icon" style="background: linear-gradient(180deg,#fff,#999)">⚙️</div><div class="menu-text">设置</div></div>
          <div class="menu-item" onclick="openApp('gallery')"><div class="menu-icon" style="background: linear-gradient(180deg,#fff,#f0f)">🖼️</div><div class="menu-text">图库</div></div>
          <div class="menu-item" onclick="openApp('web')"><div class="menu-icon" style="background: linear-gradient(180deg,#fff,#00f)">🌐</div><div class="menu-text">网络</div></div>
          <div class="menu-item" onclick="openApp('ovi')"><div class="menu-icon" style="background: linear-gradient(180deg,#fff,#08f)">🛍️</div><div class="menu-text">Ovi</div></div>
        </div>
        <div class="softkey-bar"><span class="sk-btn" onclick="openApp('calc')">打开</span><span class="sk-btn" onclick="switchView('home')">返回</span></div>
      </div>

      <!-- App 容器 -->
      <div class="view" id="app-view">
        <div class="app-title" id="app-title">应用</div>
        <div class="app-content" id="app-content"></div>
        <div class="softkey-bar"><span class="sk-btn">选项</span><span class="sk-btn" onclick="closeApp()">返回</span></div>
      </div>
    </div>
  </div>

  <!-- 2. 物理键盘区域 -->
  <div class="num-pad">
    <div class="nav-area">
      <div class="softkey" id="sk-left" onclick="handleSoftkey('left')">选项</div>
      <div class="nav-ring" id="nav-ring" onclick="handleSoftkey('center')">
        <div class="nav-center"></div><div class="nav-up">▲</div><div class="nav-down">▼</div><div class="nav-left">◀</div><div class="nav-right">▶</div>
      </div>
      <div class="softkey" id="sk-right" onclick="handleSoftkey('right')">返回</div>
    </div>
    <div class="key-grid" id="key-grid">
      <div class="key" data-key="1" onclick="vibrate()">1<span>.,?!</span></div>
      <div class="key" data-key="2" onclick="vibrate()">2<span>abc</span></div>
      <div class="key" data-key="3" onclick="vibrate()">3<span>def</span></div>
      <div class="key red" data-key="Backspace" onclick="handleSoftkey('clear')">C</div>
      
      <div class="key" data-key="4" onclick="vibrate()">4<span>ghi</span></div>
      <div class="key" data-key="5" onclick="vibrate()">5<span>jkl</span></div>
      <div class="key" data-key="6" onclick="vibrate()">6<span>mno</span></div>
      <div class="key green" data-key="Enter" onclick="handleSoftkey('center')">📞</div>
      
      <div class="key" data-key="7" onclick="vibrate()">7<span>pqrs</span></div>
      <div class="key" data-key="8" onclick="vibrate()">8<span>tuv</span></div>
      <div class="key" data-key="9" onclick="vibrate()">9<span>wxyz</span></div>
      <div class="key red" data-key="Escape" onclick="handleSoftkey('right')">🔴</div>
      
      <div class="key" style="background: none; border: none; box-shadow: none;"></div>
      <div class="key" data-key="0" onclick="vibrate()">0<span>space</span></div>
      <div class="key" data-key="#" onclick="vibrate()">#<span>⇧</span></div>
      <div class="key" style="background: none; border: none; box-shadow: none;"></div>
    </div>
  </div>
</div>

<script>
function vibrate() { if (navigator.vibrate) navigator.vibrate(30); }

function updateTime() {
  const now = new Date();
  const h = now.getHours().toString().padStart(2, '0');
  const m = now.getMinutes().toString().padStart(2, '0');
  document.getElementById('home-time').innerText = `${h}:${m}`;
  const days = ['日', '一', '二', '三', '四', '五', '六'];
  document.getElementById('home-date').innerText = `${now.getMonth()+1}月${now.getDate()}日 星期${days[now.getDay()]}`;
}
setInterval(updateTime, 1000);
updateTime();

const apps = {
  messages: `<div class="list-item"><div>👤</div><div><b>Sarah</b><br><span style="color:#666;font-size:12px;">今晚7点吃饭吗？</span></div></div>`,
  contacts: `<div class="list-item">👤 Alex Chen</div><div class="list-item">👤 Sarah Johnson</div><div class="list-item">👤 妈妈</div>`,
  calendar: `<div style="text-align: center; margin-top:20px;">11月 2026<br><br><b>15日</b> 星期日</div>`,
  music: `<div style="text-align: center; margin-top: 30px;"><div style="font-size: 50px;">🎵</div><b>Nokia Tune</b></div>`,
  settings: `<div class="list-item">📶 连接方式</div><div class="list-item">🔔 铃声设置</div><div class="list-item">🎨 主题模式</div>`,
  gallery: `<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;">${Array(9).fill('<div style="height: 70px; background: #ccc;"></div>').join('')}</div>`,
  web: `<div style="text-align: center; margin-top: 30px;">🌐<br>Ovi Browser</div>`,
  ovi: `<div style="text-align: center; margin-top: 30px;">🛍️<br>Ovi Store</div>`,
  calc: `
    <div class="nokia-calc">
      <div class="calc-display" id="calc-disp">0</div>
      <div class="calc-btns" id="calc-btns">
        <div class="calc-btn" onclick="calc('7')">7</div><div class="calc-btn" onclick="calc('8')">8</div><div class="calc-btn" onclick="calc('9')">9</div><div class="calc-btn" onclick="calc('/')">÷</div>
        <div class="calc-btn" onclick="calc('4')">4</div><div class="calc-btn" onclick="calc('5')">5</div><div class="calc-btn" onclick="calc('6')">6</div><div class="calc-btn" onclick="calc('*')">×</div>
        <div class="calc-btn" onclick="calc('1')">1</div><div class="calc-btn" onclick="calc('2')">2</div><div class="calc-btn" onclick="calc('3')">3</div><div class="calc-btn" onclick="calc('-')">-</div>
        <div class="calc-btn" onclick="calc('C')" style="background:#faa;">C</div><div class="calc-btn" onclick="calc('0')">0</div><div class="calc-btn" onclick="calc('.')">.</div><div class="calc-btn" onclick="calc('+')">+</div>
        <div class="calc-btn" style="grid-column: span 4; background:#0050ef; color:#fff;" onclick="calc('=')">=</div>
      </div>
    </div>`
};

let currentView = 'home';
let focusIndex = 0;
let focusableElements = [];

// 切换视图并重置焦点
function switchView(view) {
  vibrate();
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(view + '-view').classList.add('active');
  currentView = view;
  
  // 收集新视图的可交互元素
  if (view === 'home') focusableElements = Array.from(document.querySelectorAll('#home-apps .home-app'));
  else if (view === 'menu') focusableElements = Array.from(document.querySelectorAll('#menu-grid .menu-item'));
  
  // 如果是从App返回，尝试恢复焦点
  focusIndex = 0;
  updateFocus();
}

function openApp(id) {
  vibrate();
  document.getElementById('app-title').innerText = id.toUpperCase();
  document.getElementById('app-content').innerHTML = apps[id];
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('app-view').classList.add('active');
  currentView = 'app';
  
  // 在App中寻找焦点元素
  setTimeout(() => {
    if (id === 'calc') focusableElements = Array.from(document.querySelectorAll('#calc-btns .calc-btn'));
    else focusableElements = Array.from(document.querySelectorAll('#app-content .list-item'));
    focusIndex = 0;
    updateFocus();
  }, 10);
}

function closeApp() {
  vibrate();
  if (currentView === 'app') switchView('menu');
  else if (currentView === 'menu') switchView('home');
}

// 更新焦点视觉
function updateFocus() {
  focusableElements.forEach((el, i) => {
    if (i === focusIndex) {
      el.classList.add('focused');
      el.scrollIntoView({ block: 'nearest' }); // 确保焦点在可视范围内
    } else {
      el.classList.remove('focused');
    }
  });
}

// 实体键盘按键处理
function handleSoftkey(side) {
  vibrate();
  if (side === 'left') {
    // 左侧：模拟左软键
    if (currentView === 'home') switchView('menu');
    else if (currentView === 'menu') document.getElementById('sk-left').click();
  } else if (side === 'right') {
    // 右侧：返回
    closeApp();
  } else if (side === 'center') {
    // 中心：确认（等同于Enter）
    triggerEnter();
  } else if (side === 'clear') {
    // 清除键
    if (currentView === 'app' && document.getElementById('calc-disp')) calc('C');
    else closeApp();
  }
}

// 触发焦点点击
function triggerEnter() {
  if (currentView === 'app' && document.getElementById('calc-disp') && document.activeElement === document.body) {
    // 如果当前在计算器，默认输入当前焦点对应的数字或操作 (可选，这里直接触发点击)
    if(focusableElements[focusIndex]) focusableElements[focusIndex].click();
  } else if (focusableElements[focusIndex]) {
    focusableElements[focusIndex].click();
  } else if (currentView === 'home' || currentView === 'menu') {
    // 如果没有获取到焦点(比如刚进来)，默认点第一个
    switchView(currentView === 'home' ? 'menu' : 'menu');
  }
}

// 十字键导航逻辑
function moveFocus(direction) {
  if (focusableElements.length === 0) return;
  vibrate();
  
  let cols = 1;
  if (currentView === 'home') cols = 4;
  else if (currentView === 'menu') cols = 3;
  else if (currentView === 'app') {
    // 根据App内容判断列数
    const appTitle = document.getElementById('app-title').innerText.toLowerCase();
    if (appTitle === 'calc') cols = 4;
    else cols = 1; // 其他列表应用默认1列
  }
  
  const total = focusableElements.length;
  
  if (direction === 'ArrowRight') {
    if (focusIndex + 1 < total) focusIndex++;
  } else if (direction === 'ArrowLeft') {
    if (focusIndex - 1 >= 0) focusIndex--;
  } else if (direction === 'ArrowDown') {
    if (focusIndex + cols < total) focusIndex += cols;
    else {
      // 如果是最后一行，尝试跳到最后
      if (focusIndex + 1 < total) focusIndex = total - 1;
    }
  } else if (direction === 'ArrowUp') {
    if (focusIndex - cols >= 0) focusIndex -= cols;
  }
  
  updateFocus();
}

// =============== 监听键盘事件 ===============
document.addEventListener('keydown', (e) => {
  // 防止页面滚动
  if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Enter'].includes(e.key)) {
    e.preventDefault();
  }

  // 找到对应的虚拟物理按键，添加按压效果
  let keySelector = `[data-key="${e.key}"]`;
  if (e.key === 'ArrowUp') keySelector = '#nav-ring';
  if (e.key === 'ArrowDown') keySelector = '#nav-ring';
  if (e.key === 'ArrowLeft') keySelector = '#nav-ring';
  if (e.key === 'ArrowRight') keySelector = '#nav-ring';
  if (e.key === 'Backspace') keySelector = '[data-key="Backspace"]';
  if (e.key === 'Escape') keySelector = '[data-key="Escape"]';

  const keyEl = document.querySelector(keySelector);
  if (keyEl) {
    keyEl.classList.add('pressed');
    setTimeout(() => keyEl.classList.remove('pressed'), 150);
  }

  // 逻辑分发
  if (e.key === 'ArrowUp') moveFocus('ArrowUp');
  if (e.key === 'ArrowDown') moveFocus('ArrowDown');
  if (e.key === 'ArrowLeft') moveFocus('ArrowLeft');
  if (e.key === 'ArrowRight') moveFocus('ArrowRight');
  
  if (e.key === 'Enter') triggerEnter();
  if (e.key === 'Escape' || e.key === 'Backspace') closeApp();
  
  // 如果是在计算器界面，尝试识别数字键并输入
  if (currentView === 'app' && document.getElementById('calc-disp')) {
    if (/^[0-9.+\-*/=]$/.test(e.key)) {
      calc(e.key);
    }
  }
});

// 初始化焦点 (等待DOM加载)
setTimeout(() => {
  focusableElements = Array.from(document.querySelectorAll('#home-apps .home-app'));
  updateFocus();
}, 100);

function calc(val) {
  vibrate();
  const disp = document.getElementById('calc-disp');
  if (!disp) return;
  if (val === 'C') { window.calcStr = ''; disp.innerText = '0'; return; }
  if (val === '=') { try { window.calcStr = String(eval(window.calcStr)); disp.innerText = window.calcStr; } catch { disp.innerText = '错误'; window.calcStr = ''; } return; }
  if (window.calcStr === '错误') window.calcStr = '';
  window.calcStr += val;
  disp.innerText = window.calcStr;
}

document.addEventListener('gesturestart', e => e.preventDefault());
</script>
</body>
</html>
