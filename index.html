<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nokia N95</title>
<style>
/* ============ 基础重置 ============ */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
body { background: #000; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Tahoma', 'Arial', sans-serif; overflow: hidden; }

/* ============ N95 手机外壳 (滑盖结构) ============ */
.n95-phone {
  position: relative; width: 100%; max-width: 400px; height: 100vh; max-height: 850px;
  background: #111; overflow: hidden; border-radius: 20px; border: 2px solid #333;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
}

/* 滑动轨道 */
.sliding-track {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  transition: transform 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
  will-change: transform; z-index: 10;
}

/* ============ 1. 顶部多媒体键盘 (隐藏在滑轨上方) ============ */
.media-pad {
  position: absolute; top: -120px; left: 0; width: 100%; height: 120px;
  background: linear-gradient(180deg, #222 0%, #111 100%);
  display: flex; justify-content: center; align-items: center; gap: 20px;
  border-bottom: 1px solid #000; box-shadow: inset 0 -5px 10px rgba(0,0,0,0.5);
}
.media-btn { 
  width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(180deg, #444, #111);
  border: 1px solid #000; color: #fff; display: flex; justify-content: center; align-items: center;
  font-size: 18px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); cursor: pointer;
}
.media-btn:active { background: #000; transform: scale(0.95); }

/* ============ 2. 屏幕区域 ============ */
.screen-container {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: #000; display: flex; flex-direction: column; z-index: 20;
  border-bottom: 2px solid #333;
}

/* 状态栏 */
.status-bar {
  height: 24px; background: #f0f0f0; border-bottom: 1px solid #ccc; display: flex; align-items: center; justify-content: space-between; padding: 0 5px; font-size: 11px; color: #333; font-weight: bold;
}
.sb-left { display: flex; align-items: center; gap: 5px; }
.sb-signal { display: flex; align-items: flex-end; gap: 1px; height: 10px; }
.sb-signal div { width: 3px; background: #333; }
.sb-signal div:nth-child(1) { height: 3px; }
.sb-signal div:nth-child(2) { height: 5px; }
.sb-signal div:nth-child(3) { height: 7px; }
.sb-signal div:nth-child(4) { height: 9px; }
.sb-bat { width: 16px; height: 9px; border: 1px solid #333; padding: 1px; position: relative; }
.sb-bat::after { content: ''; position: absolute; right: -3px; top: 2px; width: 2px; height: 3px; background: #333; }
.sb-bat div { height: 100%; width: 80%; background: #333; }

/* 视图层 */
.view { display: none; flex: 1; flex-direction: column; background: #fff; position: relative; overflow: hidden; }
.view.active { display: flex; }

/* 软键底栏 */
.softkey-bar {
  height: 30px; background: linear-gradient(180deg, #e0e0e0 0%, #b0b0b0 100%); border-top: 1px solid #999; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 13px; font-weight: bold; color: #333;
}
.sk-btn { cursor: pointer; padding: 5px; }
.sk-btn:active { color: #0050ef; }

/* ============ 待机桌面 ============ */
#home-view { background: radial-gradient(circle at center, #002288 0%, #001144 100%); color: #fff; }
.home-header { padding: 10px; display: flex; justify-content: space-between; font-size: 12px; text-shadow: 1px 1px 1px #000; }
.home-clock { text-align: center; margin-top: 40px; text-shadow: 1px 1px 2px #000; }
.home-clock .time { font-size: 56px; font-weight: bold; letter-spacing: 2px; }
.home-clock .date { font-size: 14px; margin-top: 5px; }
.home-shortcuts { margin-top: auto; padding: 10px; display: flex; gap: 5px; }
.home-shortcut { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); border-radius: 4px; padding: 8px; flex: 1; text-align: center; font-size: 12px; color: #fff; cursor: pointer; }
.home-shortcut:active { background: rgba(255,255,255,0.4); }

/* ============ 功能表 ============ */
#menu-view { background: #0050ef; }
.menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; }
.menu-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.menu-item:active .menu-icon { transform: scale(0.9); }
.menu-icon {
  width: 55px; height: 55px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.5);
  display: flex; justify-content: center; align-items: center; font-size: 24px;
  box-shadow: inset 0 1px 2px rgba(255,255,255,0.6), 0 3px 5px rgba(0,0,0,0.4);
  background: linear-gradient(180deg, #fff 0%, #ccc 100%); margin-bottom: 5px; transition: transform 0.1s;
}
.menu-text { color: #fff; font-size: 12px; text-shadow: 1px 1px 1px #000; font-weight: bold; }

/* ============ App 视图 ============ */
.app-title { background: linear-gradient(180deg, #4a4a4a 0%, #222 100%); color: #fff; text-align: center; padding: 6px; font-size: 16px; font-weight: bold; border-bottom: 1px solid #000; }
.app-content { flex: 1; overflow-y: auto; background: #fff; color: #000; padding: 10px; font-size: 14px; }
.list-item { padding: 12px 5px; border-bottom: 1px solid #ddd; display: flex; align-items: center; gap: 10px; cursor: pointer; }
.list-item:active { background: #e0e0e0; }

/* 计算器 */
.nokia-calc { display: flex; flex-direction: column; height: 100%; background: #e0e0e0; padding: 5px; }
.calc-display { background: #ccffcc; border: 2px inset #999; padding: 10px; font-family: monospace; font-size: 24px; text-align: right; margin-bottom: 10px; }
.calc-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; flex: 1; }
.calc-btn { background: linear-gradient(180deg, #fff 0%, #ccc 100%); border: 1px solid #999; border-radius: 4px; font-size: 18px; font-weight: bold; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 0 #999; }
.calc-btn:active { box-shadow: none; transform: translateY(2px); }

/* ============ 3. 底部数字键盘 (隐藏在滑轨下方) ============ */
.num-pad {
  position: absolute; top: 100%; left: 0; width: 100%; height: 280px;
  background: #1a1a1a; display: flex; flex-direction: column; padding: 10px;
}
/* 导航键区域 */
.nav-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.nav-ring { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(180deg, #333 0%, #111 100%); position: relative; box-shadow: inset 0 2px 5px rgba(255,255,255,0.2), 0 5px 10px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; }
.nav-center { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(180deg, #555 0%, #222 100%); border: 1px solid #000; }
.nav-up, .nav-down, .nav-left, .nav-right { position: absolute; color: #aaa; font-size: 14px; }
.nav-up { top: 2px; } .nav-down { bottom: 2px; } .nav-left { left: 5px; } .nav-right { right: 5px; }
/* 软键 */
.softkey { width: 80px; height: 32px; background: linear-gradient(180deg, #333 0%, #111 100%); border-radius: 16px 16px 4px 4px; color: #fff; font-size: 12px; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 1px 2px rgba(255,255,255,0.2); border: 1px solid #000; }
.softkey:active { background: #000; }
/* 数字键 */
.key-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: 1; }
.key { background: linear-gradient(180deg, #3a3a3a 0%, #151515 100%); border-radius: 5px; border: 1px solid #000; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 18px; font-weight: bold; box-shadow: 0 2px 2px rgba(0,0,0,0.5); }
.key:active { background: #000; }
.key span { font-size: 9px; color: #888; margin-top: 2px; font-weight: normal; text-transform: uppercase; }

/* ============ 滑盖提示与控制 ============ */
.slide-hint {
  position: absolute; left: 0; width: 100%; height: 20px; z-index: 100;
  display: flex; justify-content: center; align-items: center; cursor: pointer;
}
.slide-hint.top { top: 0; background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%); }
.slide-hint.bottom { bottom: 0; background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%); }
.hint-text { font-size: 10px; color: rgba(255,255,255,0.6); letter-spacing: 1px; }
</style>
</head>
<body>

<div class="n95-phone" id="n95Phone">
  
  <!-- 控制区域，用于手势识别 -->
  <div class="slide-hint top" onclick="slideTo('media')"><span class="hint-text">▼ 推下露出数字键盘</span></div>
  <div class="slide-hint bottom" onclick="slideTo('num')"><span class="hint-text">▲ 推上露出媒体键</span></div>

  <!-- 滑动轨道 -->
  <div class="sliding-track" id="slidingTrack">
    
    <!-- 顶部：隐藏的多媒体键盘 -->
    <div class="media-pad">
      <div class="media-btn">⏮</div>
      <div class="media-btn">▶️</div>
      <div class="media-btn">⏭</div>
      <div class="media-btn">⏹</div>
    </div>

    <!-- 中间：全屏屏幕区 -->
    <div class="screen-container">
      <!-- 状态栏 -->
      <div class="status-bar">
        <div class="sb-left"><div class="sb-signal"><div></div><div></div><div></div><div></div></div><span>中国移动</span></div>
        <div class="sb-left" style="gap: 8px;"><span>3G</span><div class="sb-bat"><div></div></div></div>
      </div>

      <!-- 1. 桌面 -->
      <div class="view active" id="home-view">
        <div class="home-header"><span>中国移动</span><span>标准</span></div>
        <div class="home-clock">
          <div class="time" id="home-time">10:00</div>
          <div class="date" id="home-date">11月15日 星期六</div>
        </div>
        <div class="home-shortcuts">
          <div class="home-shortcut" onclick="openApp('messages')">💬 信息</div>
          <div class="home-shortcut" onclick="openApp('contacts')">👤 通讯录</div>
          <div class="home-shortcut" onclick="switchView('menu')">≡ 功能表</div>
        </div>
        <div class="softkey-bar"><span class="sk-btn" onclick="switchView('menu')">功能表</span><span class="sk-btn">通讯录</span></div>
      </div>

      <!-- 2. 功能表 -->
      <div class="view" id="menu-view">
        <div class="menu-grid">
          <div class="menu-item" onclick="openApp('messages')"><div class="menu-icon" style="background: linear-gradient(180deg,#fff,#0f0)">✉️</div><div class="menu-text">信息</div></div>
          <div class="menu-item" onclick="openApp('contacts')"><div class="menu-icon" style="background: linear-gradient(180deg,#fff,#ff0)">👤</div><div class="menu-text">通讯录</div></div>
          <div class="menu-item" onclick="openApp('calendar')"><div class="menu-icon" style="background: linear-gradient(180deg,#fff,#f00)">📅</div><div class="menu-text">日历</div></div>
          <div class="menu-item" onclick="openApp('music')"><div class="menu-icon" style="background: linear-gradient(180deg,#fff,#0ff)">🎵</div><div class="menu-text">音乐</div></div>
          <div class="menu-item" onclick="openApp('calc')"><div class="menu-icon" style="background: linear-gradient(180deg,#fff,#aaa)">🔢</div><div class="menu-text">计算器</div></div>
          <div class="menu-item" onclick="openApp('settings')"><div class="menu-icon" style="background: linear-gradient(180deg,#fff,#999)">⚙️</div><div class="menu-text">设置</div></div>
          <div class="menu-item" onclick="openApp('gallery')"><div class="menu-icon" style="background: linear-gradient(180deg,#fff,#f0f)">🖼️</div><div class="menu-text">图库</div></div>
          <div class="menu-item" onclick="openApp('web')"><div class="menu-icon" style="background: linear-gradient(180deg,#fff,#00f)">🌐</div><div class="menu-text">网络</div></div>
          <div class="menu-item" onclick="openApp('ovi')"><div class="menu-icon" style="background: linear-gradient(180deg,#fff,#08f)">🛍️</div><div class="menu-text">Ovi</div></div>
        </div>
        <div class="softkey-bar"><span class="sk-btn" onclick="openApp('calc')">打开</span><span class="sk-btn" onclick="switchView('home')">返回</span></div>
      </div>

      <!-- 3. App 容器 -->
      <div class="view" id="app-view">
        <div class="app-title" id="app-title">应用</div>
        <div class="app-content" id="app-content"></div>
        <div class="softkey-bar"><span class="sk-btn">选项</span><span class="sk-btn" onclick="closeApp()">返回</span></div>
      </div>
    </div>

    <!-- 底部：数字键盘区 -->
    <div class="num-pad">
      <div class="nav-area">
        <div class="softkey" onclick="vibrate()">选项</div>
        <div class="nav-ring" onclick="vibrate()">
          <div class="nav-center"></div><div class="nav-up">▲</div><div class="nav-down">▼</div><div class="nav-left">◀</div><div class="nav-right">▶</div>
        </div>
        <div class="softkey" onclick="closeApp()">返回</div>
      </div>
      <div class="key-grid">
        <div class="key" onclick="vibrate()">1<span>.,?!</span></div><div class="key" onclick="vibrate()">2<span>abc</span></div><div class="key" onclick="vibrate()">3<span>def</span></div><div class="key" style="background: #4a1a1a;" onclick="vibrate()">C</div>
        <div class="key" onclick="vibrate()">4<span>ghi</span></div><div class="key" onclick="vibrate()">5<span>jkl</span></div><div class="key" onclick="vibrate()">6<span>mno</span></div><div class="key" style="background: #1a4a1a;" onclick="vibrate()">📞</div>
        <div class="key" onclick="vibrate()">7<span>pqrs</span></div><div class="key" onclick="vibrate()">8<span>tuv</span></div><div class="key" onclick="vibrate()">9<span>wxyz</span></div><div class="key" style="background: #4a1a1a;" onclick="vibrate()">🔴</div>
        <div class="key" style="background: none; border: none; box-shadow: none;"></div>
        <div class="key" onclick="vibrate()">0<span>space</span></div>
        <div class="key" onclick="vibrate()">#<span>⇧</span></div>
        <div class="key" style="background: none; border: none; box-shadow: none;"></div>
      </div>
    </div>

  </div>
</div>

<script>
// 震动反馈
function vibrate() {
  if (navigator.vibrate) navigator.vibrate(30);
}

// 时间更新
function updateTime() {
  const now = new Date();
  const h = now.getHours().toString().padStart(2, '0');
  const m = now.getMinutes().toString().padStart(2, '0');
  document.getElementById('home-time').innerText = `${h}:${m}`;
  const days = ['日', '一', '二', '三', '四', '五', '六'];
  document.getElementById('home-date').innerText = `${now.getMonth()+1}月${now.getDate()}日 星期${days[now.getDay()]}`;
}
setInterval(updateTime, 1000);
updateTime();

// 视图切换
let currentView = 'home';
function switchView(view) {
  vibrate();
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(view + '-view').classList.add('active');
  currentView = view;
}

// App 数据
const apps = {
  messages: `<div class="list-item"><div>👤</div><div><b>Sarah</b><br><span style="color:#666;font-size:12px;">今晚7点吃饭吗？</span></div></div>`,
  contacts: `<div class="list-item">👤 Alex Chen</div><div class="list-item">👤 Sarah Johnson</div><div class="list-item">👤 妈妈</div>`,
  calendar: `<div style="text-align: center; margin-top:20px;">11月 2026<br><br><b>15日</b> 星期六</div>`,
  music: `<div style="text-align: center; margin-top: 30px;"><div style="font-size: 50px;">🎵</div><b>Nokia Tune</b></div>`,
  settings: `<div class="list-item">📶 连接方式</div><div class="list-item">🔔 铃声设置</div><div class="list-item">🎨 主题模式</div>`,
  gallery: `<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;">${Array(9).fill('<div style="height: 70px; background: #ccc;"></div>').join('')}</div>`,
  web: `<div style="text-align: center; margin-top: 30px;">🌐<br>Ovi Browser</div>`,
  ovi: `<div style="text-align: center; margin-top: 30px;">🛍️<br>Ovi Store</div>`,
  calc: `
    <div class="nokia-calc">
      <div class="calc-display" id="calc-disp">0</div>
      <div class="calc-btns">
        <div class="calc-btn" onclick="calc('7')">7</div><div class="calc-btn" onclick="calc('8')">8</div><div class="calc-btn" onclick="calc('9')">9</div><div class="calc-btn" onclick="calc('/')">÷</div>
        <div class="calc-btn" onclick="calc('4')">4</div><div class="calc-btn" onclick="calc('5')">5</div><div class="calc-btn" onclick="calc('6')">6</div><div class="calc-btn" onclick="calc('*')">×</div>
        <div class="calc-btn" onclick="calc('1')">1</div><div class="calc-btn" onclick="calc('2')">2</div><div class="calc-btn" onclick="calc('3')">3</div><div class="calc-btn" onclick="calc('-')">-</div>
        <div class="calc-btn" onclick="calc('C')" style="background:#faa;">C</div><div class="calc-btn" onclick="calc('0')">0</div><div class="calc-btn" onclick="calc('.')">.</div><div class="calc-btn" onclick="calc('+')">+</div>
        <div class="calc-btn" style="grid-column: span 4; background:#0050ef; color:#fff;" onclick="calc('=')">=</div>
      </div>
    </div>`
};

function openApp(id) {
  vibrate();
  document.getElementById('app-title').innerText = id.toUpperCase();
  document.getElementById('app-content').innerHTML = apps[id];
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('app-view').classList.add('active');
  currentView = 'app';
  if (id === 'calc') { window.calcStr = ''; document.getElementById('calc-disp').innerText = '0'; }
}

function closeApp() {
  vibrate();
  if (currentView === 'app') switchView('menu');
  else if (currentView === 'menu') switchView('home');
}

function calc(val) {
  vibrate();
  const disp = document.getElementById('calc-disp');
  if (val === 'C') { window.calcStr = ''; disp.innerText = '0'; return; }
  if (val === '=') { try { window.calcStr = String(eval(window.calcStr)); disp.innerText = window.calcStr; } catch { disp.innerText = '错误'; window.calcStr = ''; } return; }
  if (window.calcStr === '错误') window.calcStr = '';
  window.calcStr += val;
  disp.innerText = window.calcStr;
}

/* =========================================
   N95 核心：推拉滑盖逻辑
   ========================================= */
const track = document.getElementById('slidingTrack');
let currentSlide = 0; // 0: 闭合, -280: 数字键盘, 120: 媒体键

function slideTo(mode) {
  vibrate();
  if (mode === 'num') {
    currentSlide = -280;
  } else if (mode === 'media') {
    currentSlide = 120;
  } else {
    currentSlide = 0;
  }
  track.style.transform = `translateY(${currentSlide}px)`;
}

/* 手动拖拽滑盖手势 */
let startY = 0;
let isDragging = false;
let startTransform = 0;
const phone = document.getElementById('n95Phone');

phone.addEventListener('touchstart', e => {
  // 如果点在屏幕内的列表滚动区，不触发滑盖
  if (e.target.closest('.app-content') || e.target.closest('.home-shortcuts') || e.target.closest('.menu-grid')) return;
  
  startY = e.touches[0].clientY;
  isDragging = true;
  startTransform = currentSlide;
  track.style.transition = 'none'; // 拖动时取消过渡动画
}, {passive: true});

phone.addEventListener('touchmove', e => {
  if (!isDragging) return;
  const dy = e.touches[0].clientY - startY;
  let newTransform = startTransform + dy;
  
  // 限制边界
  if (newTransform > 150) newTransform = 150;
  if (newTransform < -320) newTransform = -320;
  
  track.style.transform = `translateY(${newTransform}px)`;
  
  // 阻止页面滚动
  if (e.cancelable) e.preventDefault();
}, {passive: false});

phone.addEventListener('touchend', e => {
  if (!isDragging) return;
  isDragging = false;
  track.style.transition = 'transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1)';
  
  const dy = e.changedTouches[0].clientY - startY;
  
  // 根据滑动距离自动吸附
  if (currentSlide === 0) {
    if (dy < -80) slideTo('num');
    else if (dy > 80) slideTo('media');
    else slideTo('close');
  } else if (currentSlide === -280) {
    if (dy > 80) slideTo('close');
    else slideTo('num');
  } else if (currentSlide === 120) {
    if (dy < -80) slideTo('close');
    else slideTo('media');
  }
});

// 阻止双击缩放
document.addEventListener('gesturestart', e => e.preventDefault());
</script>
</body>
</html>
