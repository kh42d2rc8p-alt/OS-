<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Metro OS</title>
<style>
/* ============ 基础重置 ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI','Roboto',sans-serif;background:#000;color:#fff;user-select:none;}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;outline:none;}
::-webkit-scrollbar{display:none;}

/* ============ 设备容器 ============ */
.device{
  position:relative;height:min(846px,100vh);aspect-ratio:392/846;
  background:#000;overflow:hidden;isolation:isolate;
}
@media (max-width:560px),(max-height:700px){
  .device{width:100vw;height:100vh;aspect-ratio:auto;}
}

/* ============ 状态栏 ============ */
.status-bar{
  position:absolute;top:0;left:0;right:0;height:30px;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 16px;font-size:12px;font-weight:300;letter-spacing:.5px;
  pointer-events:none;
}
.sb-right{display:flex;align-items:center;gap:8px;}
.battery{width:20px;height:10px;border:1px solid #fff;position:relative;}
.battery::after{content:'';position:absolute;right:-3px;top:2.5px;width:2px;height:4px;background:#fff;}
.battery-fill{height:100%;width:84%;background:#fff;}

/* ============ 主屏幕 (Metro 风格) ============ */
.home{
  position:absolute;inset:0;z-index:10;
  padding:40px 10px 20px;
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:8px;
  align-content:start;
  overflow-y:auto;
  transition:transform .3s cubic-bezier(0.1, 0.9, 0.2, 1), opacity .3s;
}
.home.zoomed{transform:scale(1.1);opacity:0;pointer-events:none;}

/* 磁贴基础样式 */
.tile{
  position:relative;background:#0050ef;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;
  color:#fff;overflow:hidden;transition:transform .1s;width:100%;
}
.tile:active{transform:scale(0.95);}
.tile-title{font-size:12px;font-weight:400;margin-top:4px;}
.tile-icon svg{width:32px;height:32px;fill:#fff;}

/* 磁贴尺寸优化 */
.tile.small{grid-column:span 2;grid-row:span 2;aspect-ratio:1/1;}
.tile.wide{grid-column:span 4;grid-row:span 2;aspect-ratio:2.1/1;}
.tile.large{grid-column:span 4;grid-row:span 4;aspect-ratio:1/1;}

/* 不同应用的颜色 */
.tile[data-app="weather"]{background:#0050ef;}
.tile[data-app="calendar"]{background:#d13438;}
.tile[data-app="photos"]{background:#107c10;}
.tile[data-app="notes"]{background:#ffb900;color:#000;}
.tile[data-app="notes"] .tile-icon svg{fill:#000;}
.tile[data-app="calculator"]{background:#5c2d91;}
.tile[data-app="settings"]{background:#4c4a48;}
.tile[data-app="messages"]{background:#00b294;}
.tile[data-app="camera"]{background:#767676;}
.tile[data-app="files"]{background:#ff8c00;}
.tile[data-app="maps"]{background:#00aba9;}
.tile[data-app="clock"]{background:#e81123;}

/* 动态翻转动画 */
.tile-inner{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;backface-visibility:hidden;}
.tile-inner.back{transform:rotateX(180deg);background:rgba(0,0,0,.4);justify-content:center;align-items:center;font-size:24px;font-weight:300;}
.tile.animate .tile-inner.front{animation:flipFront 10s infinite;}
.tile.animate .tile-inner.back{animation:flipBack 10s infinite;}
@keyframes flipFront{0%,45%{transform:rotateX(0);}50%,95%{transform:rotateX(180deg);}100%{transform:rotateX(0);}}
@keyframes flipBack{0%,45%{transform:rotateX(180deg);}50%,95%{transform:rotateX(0);}100%{transform:rotateX(180deg);}}

/* ============ 应用视图 ============ */
.app-view{
  position:absolute;inset:0;z-index:60;display:none;flex-direction:column;
  background:#000;overflow:hidden;
  transition:transform .3s cubic-bezier(0.1, 0.9, 0.2, 1), opacity .2s;
  will-change:transform;
}
.app-view.active{display:flex;}

/* 滑动关闭提示条 */
.swipe-hint{
  position:absolute;top:30px;left:50%;transform:translateX(-50%);
  width:40px;height:4px;background:rgba(255,255,255,.3);border-radius:2px;
  z-index:100;pointer-events:none;transition:opacity .3s;
}

/* 应用内导航 */
.app-nav{padding:40px 20px 10px;display:flex;align-items:baseline;gap:15px;flex-shrink:0;}
.nav-title{font-size:36px;font-weight:300;letter-spacing:-1px;}
.app-scroll{flex:1;overflow-y:auto;padding:10px 20px 40px;}

/* WP 卡片风格 */
.card{background:#1f1f1f;padding:16px;margin-bottom:12px;border-left:4px solid #0050ef;}

/* 天气 */
.wx-hero{text-align:left;padding:20px 0 30px;}
.wx-city{font-size:20px;font-weight:300;}
.wx-temp{font-size:84px;font-weight:200;line-height:1;margin:10px 0;}
.wx-desc{font-size:16px;}

/* 日历 */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;}
.cal-dow{font-size:12px;color:#aaa;padding:8px 0;}
.cal-cell{padding:8px 0;font-size:14px;font-weight:300;}
.cal-cell.today{background:#d13438;font-weight:600;}

/* 计算器 */
.calc{flex:1;display:flex;flex-direction:column;padding:20px;}
.calc-display{flex:1;display:flex;align-items:flex-end;justify-content:flex-end;font-size:60px;font-weight:200;padding-bottom:20px;}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
.calc-key{aspect-ratio:1;background:#1f1f1f;display:grid;place-items:center;font-size:24px;font-weight:300;}
.calc-key:active{background:#333;}
.calc-key.op{background:#0050ef;}
.calc-key.fn{background:#333;}

/* 其他应用 */
.msg-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #222;align-items:center;}
.msg-avatar{width:40px;height:40px;border-radius:50%;background:#0050ef;display:grid;place-items:center;font-size:16px;}
.msg-meta{flex:1;}
.msg-meta .n{font-size:16px;}
.msg-meta .p{font-size:13px;color:#888;margin-top:2px;}
.note-item{background:#1f1f1f;padding:16px;margin-bottom:8px;}
.note-item h4{font-size:16px;margin-bottom:4px;}
.note-item p{font-size:13px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #222;}
.toggle{width:40px;height:20px;background:#333;position:relative;transition:background .2s;}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;transition:transform .2s;}
.toggle.on{background:#0050ef;}
.toggle.on::after{transform:translateX(20px);}
.photos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;}
.photo-tile{aspect-ratio:1;background:#333;}

/* ============ 锁屏 ============ */
.lockscreen{
  position:absolute;inset:0;z-index:400;display:flex;flex-direction:column;justify-content:center;align-items:center;
  background:#000;transition:transform .4s cubic-bezier(0.1, 0.9, 0.2, 1), opacity .3s;
}
.lockscreen.unlocked{transform:translateY(-100%);opacity:0;pointer-events:none;}
.lock-time{font-size:90px;font-weight:200;letter-spacing:-2px;line-height:1;}
.lock-date{font-size:20px;font-weight:300;color:#aaa;margin-top:10px;}
.unlock-hint{margin-top:40px;font-size:14px;color:#aaa;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:0.5;}50%{opacity:1;}}

/* 关闭按钮 */
.close-btn{
  position:absolute;top:40px;right:20px;z-index:100;
  width:36px;height:36px;background:rgba(255,255,255,.1);border-radius:50%;
  display:grid;place-items:center;font-size:20px;
}
</style>
</head>
<body>

<div class="device">
  <div class="screen" id="screen">
    <!-- 状态栏 -->
    <div class="status-bar">
      <div id="sbTime">9:41</div>
      <div class="sb-right">
        <svg width="14" height="10" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4"/><rect x="5" y="5" width="3" height="7"/><rect x="10" y="2" width="3" height="10"/><rect x="15" y="0" width="3" height="12"/></svg>
        <div class="battery"><div class="battery-fill"></div></div>
      </div>
    </div>

    <!-- 主屏幕 -->
    <div class="home" id="home">
      <div class="tile large animate" data-app="weather">
        <div class="tile-inner front">
          <div style="font-size:40px;font-weight:200;">72°</div>
          <div class="tile-title">Cupertino</div>
        </div>
        <div class="tile-inner back">
          <div>⛅️</div>
          <div style="font-size:12px;margin-top:10px;">Mostly Sunny</div>
        </div>
      </div>
      
      <div class="tile wide" data-app="calendar">
        <div class="tile-inner front">
          <div style="font-size:24px;font-weight:300;" id="tileDate">Mon, Jan 1</div>
          <div class="tile-title">Calendar</div>
        </div>
      </div>
      
      <div class="tile small" data-app="messages">
        <div class="tile-inner front">
          <div class="tile-icon"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.6L3.5 20.5l1.4-5A8.5 8.5 0 1 1 21 11.5z"/></svg></div>
          <div class="tile-title">Messages</div>
        </div>
      </div>
      
      <div class="tile small" data-app="photos">
        <div class="tile-inner front">
          <div class="tile-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg></div>
          <div class="tile-title">Photos</div>
        </div>
      </div>
      
      <div class="tile small" data-app="calculator">
        <div class="tile-inner front">
          <div class="tile-icon"><svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20"/><path d="M8 8h8M8 12h8M8 16h8"/></svg></div>
          <div class="tile-title">Calculator</div>
        </div>
      </div>

      <div class="tile small" data-app="settings">
        <div class="tile-inner front">
          <div class="tile-icon"><svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/><path d="M12 2l2 3h-4l2-3zm0 20l-2-3h4l-2 3zM2 12l3-2v4l-3-2zm20 0l-3 2v-4l3 2z"/></svg></div>
          <div class="tile-title">Settings</div>
        </div>
      </div>
      
      <div class="tile wide" data-app="notes">
        <div class="tile-inner front">
          <div class="tile-icon"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 8h8M8 12h8M8 16h5"/></svg></div>
          <div class="tile-title">Notes</div>
        </div>
      </div>
    </div>

    <!-- 应用层 -->
    <div class="app-layer" id="appLayer"></div>

    <!-- 锁屏 -->
    <div class="lockscreen" id="lockScreen">
      <div class="lock-time" id="lockTime">9:41</div>
      <div class="lock-date" id="lockDate">Monday, January 1</div>
      <div class="unlock-hint">Swipe up or Tap to unlock</div>
    </div>
  </div>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const homeEl = $('#home');
const lockEl = $('#lockScreen');
const appLayer = $('#appLayer');

const state = { openApp: null, locked: true };
const viewEls = {}; // 修复了这里，现在不会报错了

// 时间更新
function tick() {
  const now = new Date();
  const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
  const dateStr = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  const shortDate = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  
  $('#sbTime').textContent = timeStr;
  $('#lockTime').textContent = timeStr;
  $('#lockDate').textContent = dateStr;
  if ($('#tileDate')) $('#tileDate').textContent = shortDate;
}
setInterval(tick, 1000);
tick();

// 应用内容模板
const BUILD = {
  weather: `<div style="background:#0050ef;flex:1;padding:20px;">
    <div style="font-size:36px;font-weight:300;margin-bottom:20px;">Weather</div>
    <div class="wx-hero"><div class="wx-city">Cupertino</div><div class="wx-temp">72°</div><div class="wx-desc">Mostly Sunny</div></div>
  </div>`,
  calendar: `<div class="app-nav"><div class="nav-title">Calendar</div></div>
    <div class="app-scroll">
      <div class="card" style="border-color:#d13438;">
        <div style="font-size:20px;margin-bottom:15px;">January 2024</div>
        <div class="cal-grid">
          <div class="cal-dow">S</div><div class="cal-dow">M</div><div class="cal-dow">T</div><div class="cal-dow">W</div><div class="cal-dow">T</div><div class="cal-dow">F</div><div class="cal-dow">S</div>
          ${Array(31).fill(0).map((_, i) => `<div class="cal-cell ${i===14?'today':''}">${i+1}</div>`).join('')}
        </div>
      </div>
    </div>`,
  messages: `<div class="app-nav"><div class="nav-title">Messages</div></div>
    <div class="app-scroll">
      <div class="msg-item"><div class="msg-avatar">S</div><div class="msg-meta"><div class="n">Sarah</div><div class="p">Are we still on for dinner?</div></div></div>
      <div class="msg-item"><div class="msg-avatar" style="background:#d13438">D</div><div class="msg-meta"><div class="n">Design Team</div><div class="p">Maya: pushed the new mockups</div></div></div>
    </div>`,
  calculator: `<div class="app-nav"><div class="nav-title">Calculator</div></div>
    <div class="calc"><div class="calc-display" id="calcDisp">0</div>
    <div class="calc-keys">
      <button class="calc-key fn">AC</button><button class="calc-key fn">±</button><button class="calc-key fn">%</button><button class="calc-key op">÷</button>
      <button class="calc-key">7</button><button class="calc-key">8</button><button class="calc-key">9</button><button class="calc-key op">×</button>
      <button class="calc-key">4</button><button class="calc-key">5</button><button class="calc-key">6</button><button class="calc-key op">−</button>
      <button class="calc-key">1</button><button class="calc-key">2</button><button class="calc-key">3</button><button class="calc-key op">+</button>
      <button class="calc-key" style="grid-column:span 2">0</button><button class="calc-key">.</button><button class="calc-key op">=</button>
    </div></div>`,
  photos: `<div class="app-nav"><div class="nav-title">Photos</div></div>
    <div class="photos-grid" style="padding:0 10px;">
      ${Array(9).fill(0).map(()=>`<div class="photo-tile"></div>`).join('')}
    </div>`,
  notes: `<div class="app-nav"><div class="nav-title">Notes</div></div>
    <div class="app-scroll">
      <div class="note-item"><h4>Shopping List</h4><p>Oat milk, Sourdough, Avocados...</p></div>
      <div class="note-item"><h4>Ideas</h4><p>Dark mode everywhere, Gestures...</p></div>
    </div>`,
  settings: `<div class="app-nav"><div class="nav-title">Settings</div></div>
    <div class="app-scroll">
      <div class="set-row"><span>Wi-Fi</span><span style="color:#888">Nova-5G</span></div>
      <div class="set-row"><span>Bluetooth</span><div class="toggle on"></div></div>
      <div class="set-row"><span>Airplane Mode</span><div class="toggle"></div></div>
    </div>`
};

// 生成 App 视图并存入 viewEls
Object.keys(BUILD).forEach(id => {
  const el = document.createElement('div');
  el.className = 'app-view';
  el.dataset.app = id;
  el.innerHTML = `
    <div class="swipe-hint"></div>
    <button class="close-btn" onclick="closeApp()">×</button>
    ${BUILD[id]}
  `;
  appLayer.appendChild(el);
  viewEls[id] = el;
});

// 磁贴点击事件
$$('.tile').forEach(tile => {
  tile.addEventListener('click', () => openApp(tile.dataset.app));
});

// 打开 App
function openApp(id) {
  if (state.openApp || state.locked) return;
  const view = viewEls[id];
  if (!view) return;
  
  state.openApp = id;
  view.style.display = 'flex';
  view.style.transform = 'translateY(100%)';
  view.style.opacity = '0';
  
  requestAnimationFrame(() => {
    view.style.transform = 'translateY(0)';
    view.style.opacity = '1';
  });
  
  homeEl.classList.add('zoomed');
  
  if (id === 'calculator') initCalculator(view);
}

// 关闭 App
function closeApp() {
  const id = state.openApp;
  if (!id) return;
  const view = viewEls[id];
  
  view.style.transform = 'translateY(100%)';
  view.style.opacity = '0';
  homeEl.classList.remove('zoomed');
  
  state.openApp = null;
  setTimeout(() => { view.style.display = 'none'; }, 300);
}

// 计算器逻辑
function initCalculator(view) {
  const disp = view.querySelector('#calcDisp');
  let cur = '0';
  view.querySelectorAll('.calc-key').forEach(btn => {
    btn.onclick = () => {
      const k = btn.textContent;
      if (k === 'AC') { cur = '0'; }
      else if (k === '=') { try { cur = String(eval(cur.replace('×','*').replace('÷','/').replace('−','-'))); } catch { cur = 'Error'; } }
      else if ('+−×÷'.includes(k)) { cur += k; }
      else { cur = cur === '0' ? k : cur + k; }
      disp.textContent = cur;
    };
  });
}

// ================= 滑动退出 App =================
let touchStartY = 0;
let isDragging = false;

appLayer.addEventListener('touchstart', e => {
  if (state.openApp) {
    touchStartY = e.touches[0].clientY;
    isDragging = true;
    const view = viewEls[state.openApp];
    view.style.transition = 'none';
  }
}, { passive: true });

appLayer.addEventListener('touchmove', e => {
  if (!isDragging || !state.openApp) return;
  const dy = e.touches[0].clientY - touchStartY;
  
  if (dy > 0) {
    const view = viewEls[state.openApp];
    view.style.transform = `translateY(${dy}px)`;
    view.style.opacity = 1 - (dy / 500);
  }
}, { passive: true });

appLayer.addEventListener('touchend', e => {
  if (!isDragging || !state.openApp) return;
  isDragging = false;
  
  const view = viewEls[state.openApp];
  const dy = e.changedTouches[0].clientY - touchStartY;
  view.style.transition = '';
  
  if (dy > 100) {
    closeApp();
  } else {
    view.style.transform = 'translateY(0)';
    view.style.opacity = '1';
  }
});

// ================= 锁屏点击/滑动解锁 =================
lockEl.addEventListener('click', () => {
  if (state.locked) {
    state.locked = false;
    lockEl.classList.add('unlocked');
  }
});

let lockStartY = 0;
lockEl.addEventListener('touchstart', e => {
  if (state.locked) lockStartY = e.touches[0].clientY;
}, { passive: true });

lockEl.addEventListener('touchend', e => {
  if (!state.locked) return;
  const dy = e.changedTouches[0].clientY - lockStartY;
  if (dy < -50) {
    state.locked = false;
    lockEl.classList.add('unlocked');
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeApp(); });
document.addEventListener('gesturestart', e => e.preventDefault());
</script>
</body>
</html>
