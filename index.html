<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nokia S60</title>
<style>
/* ============ 基础重置 ============ */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
body { background: #111; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Tahoma', 'Arial', sans-serif; overflow: hidden; }

/* ============ 手机外壳 ============ */
.phone {
  width: 100%; max-width: 380px; height: 100vh; max-height: 800px;
  background: linear-gradient(180deg, #2a2a2a 0%, #111 100%);
  display: flex; flex-direction: column; position: relative;
  border-radius: 30px; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.1);
  border: 2px solid #333;
}

/* ============ 屏幕区域 ============ */
.screen-container {
  flex: 1; background: #000; border-radius: 8px; overflow: hidden; position: relative;
  border: 3px solid #1a1a1a; box-shadow: inset 0 0 20px rgba(0,0,0,1); display: flex; flex-direction: column;
}

/* 开机动画 */
#boot-screen {
  position: absolute; inset: 0; background: #fff; z-index: 9999;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  transition: opacity 0.5s;
}
#boot-screen .logo { font-size: 40px; font-weight: bold; color: #0050ef; font-family: Arial, sans-serif; margin-bottom: 20px;}
#boot-screen .hands { font-size: 50px; animation: handshake 2s infinite; }
@keyframes handshake { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

/* 状态栏 */
.status-bar {
  height: 24px; background: #f0f0f0; border-bottom: 1px solid #ccc; display: flex; align-items: center; justify-content: space-between; padding: 0 5px; font-size: 11px; color: #333; font-weight: bold; z-index: 100;
}
.sb-left { display: flex; align-items: center; gap: 5px; }
.sb-signal { display: flex; align-items: flex-end; gap: 1px; height: 10px; }
.sb-signal div { width: 3px; background: #333; }
.sb-signal div:nth-child(1) { height: 3px; }
.sb-signal div:nth-child(2) { height: 5px; }
.sb-signal div:nth-child(3) { height: 7px; }
.sb-signal div:nth-child(4) { height: 9px; }
.sb-bat { width: 16px; height: 9px; border: 1px solid #333; padding: 1px; position: relative; }
.sb-bat::after { content: ''; position: absolute; right: -3px; top: 2px; width: 2px; height: 3px; background: #333; }
.sb-bat div { height: 100%; width: 80%; background: #333; }

/* 通用视图层 */
.view { display: none; flex: 1; flex-direction: column; background: #fff; position: relative; overflow: hidden; }
.view.active { display: flex; }

/* 软键底栏 (屏幕内) */
.softkey-bar {
  height: 30px; background: linear-gradient(180deg, #e0e0e0 0%, #b0b0b0 100%); border-top: 1px solid #999; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 13px; font-weight: bold; color: #333;
}
.sk-btn { cursor: pointer; padding: 5px; }
.sk-btn:active { color: #0050ef; }

/* ============ 待机桌面 ============ */
#home-view { background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="%23001144"/><stop offset="100%" stop-color="%23002288"/></linearGradient></defs><rect width="100%" height="100%" fill="url(%23g)"/></svg>'); color: #fff; }
.home-header { padding: 10px; display: flex; justify-content: space-between; font-size: 12px; text-shadow: 1px 1px 1px #000; }
.home-clock { text-align: center; margin-top: 30px; text-shadow: 1px 1px 2px #000; }
.home-clock .time { font-size: 48px; font-weight: bold; letter-spacing: 2px; }
.home-clock .date { font-size: 14px; margin-top: 5px; }
.home-shortcuts { margin-top: auto; padding: 10px; display: flex; gap: 5px; }
.home-shortcut { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); border-radius: 4px; padding: 5px; flex: 1; text-align: center; font-size: 11px; color: #fff; cursor: pointer; }
.home-shortcut:active { background: rgba(255,255,255,0.4); }

/* ============ 功能表 (主菜单) ============ */
#menu-view { background: #0050ef; }
.menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 15px; }
.menu-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.menu-item:active .menu-icon { transform: scale(0.9); }
.menu-icon {
  width: 50px; height: 50px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.5);
  display: flex; justify-content: center; align-items: center; font-size: 24px;
  box-shadow: inset 0 1px 2px rgba(255,255,255,0.5), 0 2px 4px rgba(0,0,0,0.3);
  background: linear-gradient(180deg, #fff 0%, #ccc 100%); margin-bottom: 5px; transition: transform 0.1s;
}
.menu-text { color: #fff; font-size: 12px; text-shadow: 1px 1px 1px #000; font-weight: bold; }

/* ============ App 视图 ============ */
.app-title { background: linear-gradient(180deg, #4a4a4a 0%, #222 100%); color: #fff; text-align: center; padding: 6px; font-size: 16px; font-weight: bold; border-bottom: 1px solid #000; }
.app-content { flex: 1; overflow-y: auto; background: #fff; color: #000; padding: 10px; font-size: 14px; }
.list-item { padding: 12px 5px; border-bottom: 1px solid #ddd; display: flex; align-items: center; gap: 10px; cursor: pointer; }
.list-item:active { background: #e0e0e0; }
.list-icon { font-size: 20px; }

/* 诺基亚计算器专属样式 */
.nokia-calc { display: flex; flex-direction: column; height: 100%; background: #e0e0e0; padding: 5px; }
.calc-display { background: #ccffcc; border: 2px inset #999; padding: 10px; font-family: 'Courier New', monospace; font-size: 24px; text-align: right; margin-bottom: 10px; color: #000; }
.calc-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; flex: 1; }
.calc-btn { background: linear-gradient(180deg, #fff 0%, #ccc 100%); border: 1px solid #999; border-radius: 4px; font-size: 18px; font-weight: bold; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 0 #999; cursor: pointer; }
.calc-btn:active { box-shadow: none; transform: translateY(2px); }

/* ============ 物理按键区 ============ */
.keypad {
  height: 200px; background: #1a1a1a; display: flex; flex-direction: column; padding: 10px;
  border-top: 2px solid #333; border-radius: 0 0 25px 25px;
}
/* 导航键区域 */
.nav-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.nav-ring { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(180deg, #333 0%, #111 100%); position: relative; box-shadow: inset 0 2px 5px rgba(255,255,255,0.2), 0 5px 10px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; }
.nav-center { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(180deg, #555 0%, #222 100%); border: 1px solid #000; }
.nav-up, .nav-down, .nav-left, .nav-right { position: absolute; color: #aaa; font-size: 14px; }
.nav-up { top: 2px; } .nav-down { bottom: 2px; } .nav-left { left: 5px; } .nav-right { right: 5px; }
/* 软键 */
.softkey { width: 80px; height: 30px; background: linear-gradient(180deg, #333 0%, #111 100%); border-radius: 15px 15px 5px 5px; color: #fff; font-size: 12px; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 1px 2px rgba(255,255,255,0.2); cursor: pointer; border: 1px solid #000; }
.softkey:active { background: #000; }
/* 数字键盘 */
.num-pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: 1; }
.key { background: linear-gradient(180deg, #3a3a3a 0%, #151515 100%); border-radius: 5px; border: 1px solid #000; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 2px rgba(0,0,0,0.5); }
.key:active { background: #000; }
.key span { font-size: 9px; color: #888; margin-top: 2px; font-weight: normal; text-transform: uppercase; }
</style>
</head>
<body>

<div class="phone">
  
  <!-- 物理按键区 (放在下方，模拟真机握持) -->
  <div class="keypad">
    <div class="nav-area">
      <div class="softkey" onclick="handleSoftkey('left')">选项</div>
      <div class="nav-ring" onclick="vibrate()">
        <div class="nav-center" onclick="handleNav()"></div>
        <div class="nav-up">▲</div><div class="nav-down">▼</div><div class="nav-left">◀</div><div class="nav-right">▶</div>
      </div>
      <div class="softkey" onclick="handleSoftkey('right')">返回</div>
    </div>
    <div class="num-pad">
      <div class="key" onclick="vibrate()">1<span>.,?!</span></div>
      <div class="key" onclick="vibrate()">2<span>abc</span></div>
      <div class="key" onclick="vibrate()">3<span>def</span></div>
      <div class="key" style="background: linear-gradient(180deg,#4a1a1a,#200);" onclick="vibrate()">C</div>
      
      <div class="key" onclick="vibrate()">4<span>ghi</span></div>
      <div class="key" onclick="vibrate()">5<span>jkl</span></div>
      <div class="key" onclick="vibrate()">6<span>mno</span></div>
      <div class="key" style="background: linear-gradient(180deg,#1a4a1a,#002);" onclick="vibrate()">📞</div>
      
      <div class="key" onclick="vibrate()">7<span>pqrs</span></div>
      <div class="key" onclick="vibrate()">8<span>tuv</span></div>
      <div class="key" onclick="vibrate()">9<span>wxyz</span></div>
      <div class="key" style="background: linear-gradient(180deg,#4a1a1a,#200);" onclick="vibrate()">🔴</div>
      
      <div class="key" style="background: none; box-shadow: none; pointer-events: none;"></div>
      <div class="key" onclick="vibrate()">0<span>space</span></div>
      <div class="key" onclick="vibrate()">#<span>⇧</span></div>
      <div class="key" style="background: none; box-shadow: none; pointer-events: none;"></div>
    </div>
  </div>

  <!-- 屏幕区 -->
  <div class="screen-container">
    <!-- 开机动画 -->
    <div id="boot-screen">
      <div class="hands">🤝</div>
      <div class="logo" style="font-family: Arial; margin-top:20px;">NOKIA</div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar">
      <div class="sb-left">
        <div class="sb-signal"><div></div><div></div><div></div><div></div></div>
        <span>中国移动</span>
      </div>
      <div class="sb-left" style="gap: 8px;">
        <span>📶 3G</span>
        <div class="sb-bat"><div id="bat-level"></div></div>
      </div>
    </div>

    <!-- 1. 待机桌面 -->
    <div class="view active" id="home-view">
      <div class="home-header">
        <span id="home-op">中国移动</span>
        <span id="home-profile">标准</span>
      </div>
      <div class="home-clock">
        <div class="time" id="home-time">10:00</div>
        <div class="date" id="home-date">11月15日 星期六</div>
      </div>
      <div class="home-shortcuts">
        <div class="home-shortcut" onclick="openApp('messages')">💬 信息</div>
        <div class="home-shortcut" onclick="openApp('contacts')">👤 通讯录</div>
        <div class="home-shortcut" onclick="switchView('menu')">≡ 功能表</div>
      </div>
      <div class="softkey-bar">
        <span class="sk-btn" onclick="switchView('menu')">功能表</span>
        <span class="sk-btn">通讯录</span>
      </div>
    </div>

    <!-- 2. 功能表 (九宫格) -->
    <div class="view" id="menu-view">
      <div class="menu-grid">
        <div class="menu-item" onclick="openApp('messages')">
          <div class="menu-icon" style="background: linear-gradient(180deg,#fff,#0f0)">✉️</div>
          <div class="menu-text">信息</div>
        </div>
        <div class="menu-item" onclick="openApp('contacts')">
          <div class="menu-icon" style="background: linear-gradient(180deg,#fff,#ff0)">👤</div>
          <div class="menu-text">通讯录</div>
        </div>
        <div class="menu-item" onclick="openApp('calendar')">
          <div class="menu-icon" style="background: linear-gradient(180deg,#fff,#f00)">📅</div>
          <div class="menu-text">日历</div>
        </div>
        <div class="menu-item" onclick="openApp('music')">
          <div class="menu-icon" style="background: linear-gradient(180deg,#fff,#0ff)">🎵</div>
          <div class="menu-text">音乐播放器</div>
        </div>
        <div class="menu-item" onclick="openApp('calc')">
          <div class="menu-icon" style="background: linear-gradient(180deg,#fff,#aaa)">🔢</div>
          <div class="menu-text">计算器</div>
        </div>
        <div class="menu-item" onclick="openApp('settings')">
          <div class="menu-icon" style="background: linear-gradient(180deg,#fff,#999)">⚙️</div>
          <div class="menu-text">设置</div>
        </div>
        <div class="menu-item" onclick="openApp('gallery')">
          <div class="menu-icon" style="background: linear-gradient(180deg,#fff,#f0f)">🖼️</div>
          <div class="menu-text">图库</div>
        </div>
        <div class="menu-item" onclick="openApp('web')">
          <div class="menu-icon" style="background: linear-gradient(180deg,#fff,#00f)">🌐</div>
          <div class="menu-text">网络</div>
        </div>
        <div class="menu-item" onclick="openApp('ovi')">
          <div class="menu-icon" style="background: linear-gradient(180deg,#fff,#08f)">🛍️</div>
          <div class="menu-text">Ovi 商店</div>
        </div>
      </div>
      <div class="softkey-bar">
        <span class="sk-btn" onclick="openApp('calc')">打开</span>
        <span class="sk-btn" onclick="switchView('home')">返回</span>
      </div>
    </div>

    <!-- 3. 应用视图 -->
    <div class="view" id="app-view">
      <div class="app-title" id="app-title">应用</div>
      <div class="app-content" id="app-content">
        <!-- 动态加载内容 -->
      </div>
      <div class="softkey-bar">
        <span class="sk-btn">选项</span>
        <span class="sk-btn" onclick="closeApp()">返回</span>
      </div>
    </div>
  </div>
</div>

<script>
// 模拟震动
function vibrate() {
  if (navigator.vibrate) navigator.vibrate(30);
}

// 视图切换
let currentView = 'home';
function switchView(view) {
  vibrate();
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(view + '-view').classList.add('active');
  currentView = view;
}

// 时间更新
function updateTime() {
  const now = new Date();
  const h = now.getHours().toString().padStart(2, '0');
  const m = now.getMinutes().toString().padStart(2, '0');
  document.getElementById('home-time').innerText = `${h}:${m}`;
  
  const year = now.getFullYear();
  const month = now.getMonth() + 1;
  const date = now.getDate();
  const days = ['日', '一', '二', '三', '四', '五', '六'];
  const day = days[now.getDay()];
  document.getElementById('home-date').innerText = `${month}月${date}日 星期${day}`;
}
setInterval(updateTime, 1000);
updateTime();

// 开机动画
setTimeout(() => {
  const boot = document.getElementById('boot-screen');
  boot.style.opacity = '0';
  setTimeout(() => boot.style.display = 'none', 500);
}, 2500); // 2.5秒后进入系统

// 应用数据与模板
const apps = {
  messages: `
    <div class="list-item"><div class="list-icon">👤</div><div><b>Sarah</b><br><span style="color:#666;font-size:12px;">我们今晚7点还吃饭吗？</span></div></div>
    <div class="list-item"><div class="list-icon">👥</div><div><b>设计团队</b><br><span style="color:#666;font-size:12px;">Maya: 刚刚上传了最新的设计稿</span></div></div>
  `,
  contacts: `
    <div class="list-item"><div class="list-icon">👤</div>Alex Chen</div>
    <div class="list-item"><div class="list-icon">👤</div>Sarah Johnson</div>
    <div class="list-item"><div class="list-icon">👤</div>妈妈</div>
  `,
  calendar: `
    <div style="font-size: 16px; font-weight: bold; margin-bottom: 10px; text-align: center;">11月 2026</div>
    <div style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; color: #666;">
      <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 5px; margin-top: 5px;">
      ${Array(30).fill(0).map((_, i) => `<div style="${i===14?'background:#0050ef;color:#fff;border-radius:50%;':''} padding: 5px 0;">${i+1}</div>`).join('')}
    </div>
  `,
  music: `
    <div style="text-align: center; margin-top: 20px;">
      <div style="font-size: 50px; margin-bottom: 10px;">🎵</div>
      <div style="font-weight: bold; font-size: 16px;">Nokia Tune</div>
      <div style="color: #666; font-size: 12px; margin-bottom: 20px;">Classic Ringtone</div>
      <div style="display: flex; justify-content: center; gap: 20px; font-size: 24px;">
        <span>⏮</span><span>▶️</span><span>⏭</span>
      </div>
    </div>
  `,
  settings: `
    <div class="list-item">📶 连接方式</div>
    <div class="list-item">🔔 铃声设置</div>
    <div class="list-item">🎨 主题模式</div>
    <div class="list-item">📅 日期和时间</div>
  `,
  gallery: `
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;">
      <div style="height: 80px; background: #ccc;"></div>
      <div style="height: 80px; background: #aaa;"></div>
      <div style="height: 80px; background: #888;"></div>
      <div style="height: 80px; background: #666;"></div>
      <div style="height: 80px; background: #444;"></div>
      <div style="height: 80px; background: #222;"></div>
    </div>
  `,
  web: `
    <div style="text-align: center; margin-top: 20px;">
      <div style="font-size: 40px;">🌐</div>
      <div style="margin-top: 10px; color: #0050ef; text-decoration: underline;">Ovi Browser</div>
      <div style="margin-top: 5px; font-size: 12px; color: #666;">(GPRS 连接中...)</div>
    </div>
  `,
  ovi: `
    <div style="text-align: center; margin-top: 20px;">
      <div style="font-size: 40px;">🛍️</div>
      <div style="margin-top: 10px; font-weight: bold; color: #0050ef;">Ovi Store</div>
      <div style="margin-top: 5px; font-size: 12px; color: #666;">发现最新的塞班应用和游戏</div>
    </div>
  `,
  calc: `
    <div class="nokia-calc">
      <div class="calc-display" id="calc-disp">0</div>
      <div class="calc-btns">
        <div class="calc-btn" onclick="calc('7')">7</div>
        <div class="calc-btn" onclick="calc('8')">8</div>
        <div class="calc-btn" onclick="calc('9')">9</div>
        <div class="calc-btn" onclick="calc('/')" style="background:#ddd;">÷</div>
        
        <div class="calc-btn" onclick="calc('4')">4</div>
        <div class="calc-btn" onclick="calc('5')">5</div>
        <div class="calc-btn" onclick="calc('6')">6</div>
        <div class="calc-btn" onclick="calc('*')" style="background:#ddd;">×</div>
        
        <div class="calc-btn" onclick="calc('1')">1</div>
        <div class="calc-btn" onclick="calc('2')">2</div>
        <div class="calc-btn" onclick="calc('3')">3</div>
        <div class="calc-btn" onclick="calc('-')" style="background:#ddd;">-</div>
        
        <div class="calc-btn" onclick="calc('C')" style="background:#faa;">C</div>
        <div class="calc-btn" onclick="calc('0')">0</div>
        <div class="calc-btn" onclick="calc('.')">.</div>
        <div class="calc-btn" onclick="calc('+')" style="background:#ddd;">+</div>
        
        <div class="calc-btn" style="grid-column: span 4; background:#0050ef; color:#fff;" onclick="calc('=')">=</div>
      </div>
    </div>
  `
};

// 打开应用
function openApp(id) {
  vibrate();
  document.getElementById('app-title').innerText = id === 'calc' ? '计算器' : id.toUpperCase();
  document.getElementById('app-content').innerHTML = apps[id] || '开发中...';
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('app-view').classList.add('active');
  currentView = 'app';
  
  if (id === 'calc') {
    window.calcStr = '';
    document.getElementById('calc-disp').innerText = '0';
  }
}

// 关闭应用 (返回上一层)
function closeApp() {
  vibrate();
  if (currentView === 'app') {
    switchView('menu');
  } else if (currentView === 'menu') {
    switchView('home');
  }
}

// 处理屏幕下方和实体软键的点击
function handleSoftkey(side) {
  vibrate();
  if (side === 'left') {
    // 左键：如果是桌面，进功能表；如果是其他地方，模拟“选项”
    if (currentView === 'home') switchView('menu');
    else if (currentView === 'menu') openApp('calc');
  } else {
    // 右键：返回上一级
    closeApp();
  }
}

// 导航中键确认
function handleNav() {
  vibrate();
  if (currentView === 'home') switchView('menu');
}

// 计算器逻辑
function calc(val) {
  vibrate();
  const disp = document.getElementById('calc-disp');
  if (val === 'C') {
    window.calcStr = '';
    disp.innerText = '0';
    return;
  }
  if (val === '=') {
    try {
      window.calcStr = String(eval(window.calcStr));
      disp.innerText = window.calcStr;
    } catch {
      disp.innerText = '错误';
      window.calcStr = '';
    }
    return;
  }
  if (window.calcStr === '错误') window.calcStr = '';
  window.calcStr += val;
  disp.innerText = window.calcStr;
}

// 阻止双击缩放
document.addEventListener('gesturestart', e => e.preventDefault());
</script>
</body>
</html>
