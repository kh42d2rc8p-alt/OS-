<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Metro OS</title>
<style>
/* 基础设置 */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: #000; color: #fff; font-family: 'Segoe UI', -apple-system, sans-serif; height: 100vh; overflow: hidden; user-select: none; }

/* 手机容器 */
.device { position: relative; width: 100%; height: 100%; max-width: 500px; margin: 0 auto; background: #000; overflow: hidden; }

/* 状态栏 */
.status-bar { position: absolute; top: 0; left: 0; right: 0; height: 30px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; font-size: 12px; z-index: 999; pointer-events: none; }

/* 锁屏 */
#lock { position: absolute; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
#lock h1 { font-size: 80px; font-weight: 200; }
#lock p { font-size: 16px; color: #aaa; margin-top: 10px; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

/* 主屏幕 (Metro UI) */
#home { padding: 40px 10px 20px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; height: 100%; overflow-y: auto; align-content: start; }
::-webkit-scrollbar { display: none; }

/* 磁贴通用样式 */
.tile { display: flex; flex-direction: column; justify-content: flex-end; padding: 15px; color: #fff; cursor: pointer; transition: transform 0.1s; }
.tile:active { transform: scale(0.95); }
.tile-title { font-size: 14px; font-weight: 400; margin-top: 5px; }

/* 磁贴高度 */
.tile.small { height: 150px; }
.tile.wide { grid-column: span 2; height: 150px; }
.tile.large { grid-column: span 2; height: 308px; }

/* 磁贴颜色 */
.bg-blue { background: #0050ef; }
.bg-red { background: #d13438; }
.bg-green { background: #107c10; }
.bg-teal { background: #00b294; }
.bg-purple { background: #5c2d91; }
.bg-gray { background: #4c4a48; }
.bg-yellow { background: #ffb900; color: #000; }

/* 动态磁贴动画 */
.flip-container { position: relative; width: 100%; height: 100%; }
.flip-front, .flip-back { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; backface-visibility: hidden; }
.flip-back { transform: rotateX(180deg); justify-content: center; align-items: center; background: rgba(0,0,0,0.3); }
.animate .flip-front { animation: flipF 10s infinite; }
.animate .flip-back { animation: flipB 10s infinite; }
@keyframes flipF { 0%, 45% { transform: rotateX(0); } 50%, 95% { transform: rotateX(180deg); } 100% { transform: rotateX(0); } }
@keyframes flipB { 0%, 45% { transform: rotateX(180deg); } 50%, 95% { transform: rotateX(0); } 100% { transform: rotateX(180deg); } }

/* App 界面 */
#app { position: absolute; inset: 0; background: #000; z-index: 500; display: none; flex-direction: column; }
.app-header { height: 60px; display: flex; align-items: center; padding: 0 15px; background: #1f1f1f; border-bottom: 2px solid #333; }
.close-btn { background: none; border: none; color: #fff; font-size: 16px; padding: 10px 15px; cursor: pointer; }
.close-btn:active { background: #333; }
#app-title { font-size: 20px; font-weight: 300; margin-left: 10px; text-transform: capitalize; }
#app-content { flex: 1; padding: 20px; overflow-y: auto; }

/* App 内部通用组件 */
.card { background: #1f1f1f; padding: 15px; margin-bottom: 10px; border-left: 4px solid #0050ef; }
.calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.calc-btn { background: #1f1f1f; border: none; color: #fff; font-size: 24px; padding: 20px 0; cursor: pointer; }
.calc-btn:active { background: #333; }
.calc-btn.op { background: #0050ef; }
.calc-btn.fn { background: #333; }
.calc-disp { font-size: 50px; font-weight: 200; text-align: right; padding: 20px; margin-bottom: 10px; background: #111; }
.msg-row { padding: 12px 0; border-bottom: 1px solid #333; }
.msg-name { font-size: 16px; }
.msg-text { font-size: 13px; color: #888; }
</style>
</head>
<body>

<div class="device">
  <!-- 顶部状态栏 -->
  <div class="status-bar">
    <span id="sb-time">10:00</span>
    <span>📶 🔋</span>
  </div>

  <!-- 锁屏界面 -->
  <div id="lock" onclick="unlock()">
    <h1 id="lock-time">10:00</h1>
    <p>点击屏幕解锁</p>
  </div>

  <!-- 主屏幕 -->
  <div id="home" style="display: none;">
    <!-- 动态大磁贴 -->
    <div class="tile large bg-blue animate" onclick="openApp('weather')">
      <div class="flip-container">
        <div class="flip-front">
          <div style="font-size: 40px; font-weight: 200;">72°</div>
          <div class="tile-title">Cupertino</div>
        </div>
        <div class="flip-back">
          <div style="font-size: 30px;">⛅️</div>
          <div style="font-size: 14px; margin-top: 10px;">Mostly Sunny</div>
        </div>
      </div>
    </div>
    
    <!-- 宽屏磁贴 -->
    <div class="tile wide bg-red" onclick="openApp('calendar')">
      <div style="font-size: 24px;" id="tile-date">11月15日</div>
      <div class="tile-title">Calendar</div>
    </div>

    <!-- 小磁贴 -->
    <div class="tile small bg-teal" onclick="openApp('messages')">
      <div style="font-size: 30px;">💬</div>
      <div class="tile-title">Messages</div>
    </div>
    <div class="tile small bg-green" onclick="openApp('photos')">
      <div style="font-size: 30px;">🖼</div>
      <div class="tile-title">Photos</div>
    </div>
    
    <div class="tile small bg-purple" onclick="openApp('calculator')">
      <div style="font-size: 30px;">🧮</div>
      <div class="tile-title">Calculator</div>
    </div>
    <div class="tile small bg-gray" onclick="openApp('settings')">
      <div style="font-size: 30px;">⚙️</div>
      <div class="tile-title">Settings</div>
    </div>
  </div>

  <!-- App 显示层 -->
  <div id="app">
    <div class="app-header">
      <button class="close-btn" onclick="closeApp()">✕ 关闭</button>
      <div id="app-title">App</div>
    </div>
    <div id="app-content"></div>
  </div>
</div>

<script>
// 更新时间和日期
function updateTime() {
  const now = new Date();
  const h = now.getHours().toString().padStart(2, '0');
  const m = now.getMinutes().toString().padStart(2, '0');
  const timeStr = `${h}:${m}`;
  
  document.getElementById('sb-time').innerText = timeStr;
  document.getElementById('lock-time').innerText = timeStr;
  
  const dateStr = `${now.getMonth() + 1}月${now.getDate()}日`;
  document.getElementById('tile-date').innerText = dateStr;
}
setInterval(updateTime, 1000);
updateTime();

// 解锁功能
function unlock() {
  document.getElementById('lock').style.display = 'none';
  document.getElementById('home').style.display = 'grid';
}

// App 内容模板
const apps = {
  weather: `
    <h1 style="font-size: 60px; font-weight: 200; margin-bottom: 20px;">72°</h1>
    <h3>Cupertino</h3>
    <p style="color: #aaa; margin-bottom: 30px;">Mostly Sunny</p>
    <div class="card" style="border-color: #0050ef;">
      <p>今天最高气温 75°，最低 60°。</p>
    </div>
  `,
  calendar: `
    <h1 style="font-size: 30px; font-weight: 300; margin-bottom: 20px;">11月 2026</h1>
    <div class="card" style="border-color: #d13438;">
      <p>15日 10:00 - 团队会议</p>
      <p style="margin-top: 10px;">15日 18:30 - 健身</p>
    </div>
  `,
  messages: `
    <div class="msg-row">
      <div class="msg-name">Sarah</div>
      <div class="msg-text">我们今晚7点还吃饭吗？</div>
    </div>
    <div class="msg-row">
      <div class="msg-name">Design Team</div>
      <div class="msg-text">Maya: 刚刚上传了最新的设计稿</div>
    </div>
  `,
  photos: `
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;">
      <div style="aspect-ratio: 1; background: #333;"></div>
      <div style="aspect-ratio: 1; background: #444;"></div>
      <div style="aspect-ratio: 1; background: #555;"></div>
      <div style="aspect-ratio: 1; background: #666;"></div>
      <div style="aspect-ratio: 1; background: #777;"></div>
      <div style="aspect-ratio: 1; background: #888;"></div>
    </div>
  `,
  calculator: `
    <div class="calc-disp" id="calc-screen">0</div>
    <div class="calc-grid">
      <button class="calc-btn fn" onclick="calc('AC')">AC</button>
      <button class="calc-btn fn" onclick="calc('+/-')">±</button>
      <button class="calc-btn fn" onclick="calc('%')">%</button>
      <button class="calc-btn op" onclick="calc('/')">÷</button>
      <button class="calc-btn" onclick="calc('7')">7</button>
      <button class="calc-btn" onclick="calc('8')">8</button>
      <button class="calc-btn" onclick="calc('9')">9</button>
      <button class="calc-btn op" onclick="calc('*')">×</button>
      <button class="calc-btn" onclick="calc('4')">4</button>
      <button class="calc-btn" onclick="calc('5')">5</button>
      <button class="calc-btn" onclick="calc('6')">6</button>
      <button class="calc-btn op" onclick="calc('-')">−</button>
      <button class="calc-btn" onclick="calc('1')">1</button>
      <button class="calc-btn" onclick="calc('2')">2</button>
      <button class="calc-btn" onclick="calc('3')">3</button>
      <button class="calc-btn op" onclick="calc('+')">+</button>
      <button class="calc-btn" style="grid-column: span 2;" onclick="calc('0')">0</button>
      <button class="calc-btn" onclick="calc('.')">.</button>
      <button class="calc-btn op" onclick="calc('=')">=</button>
    </div>
  `,
  settings: `
    <div class="card" style="border-color: #4c4a48; display: flex; justify-content: space-between;">
      <span>Wi-Fi</span> <span style="color:#888">Nova-5G</span>
    </div>
    <div class="card" style="border-color: #4c4a48; display: flex; justify-content: space-between;">
      <span>蓝牙</span> <span style="color:#888">开启</span>
    </div>
  `
};

// 打开 App
function openApp(appId) {
  document.getElementById('app-title').innerText = appId;
  document.getElementById('app-content').innerHTML = apps[appId];
  document.getElementById('app').style.display = 'flex';
  
  // 如果是计算器，重置状态
  if (appId === 'calculator') {
    window.calcStr = '';
    document.getElementById('calc-screen').innerText = '0';
  }
}

// 关闭 App
function closeApp() {
  document.getElementById('app').style.display = 'none';
}

// 计算器逻辑
function calc(val) {
  const screen = document.getElementById('calc-screen');
  if (val === 'AC') {
    window.calcStr = '';
    screen.innerText = '0';
    return;
  }
  if (val === '=') {
    try {
      window.calcStr = String(eval(window.calcStr));
      screen.innerText = window.calcStr;
    } catch {
      screen.innerText = 'Error';
      window.calcStr = '';
    }
    return;
  }
  if (window.calcStr === 'Error') window.calcStr = '';
  
  if (val === '+/-') val = '* -1';
  
  window.calcStr += val;
  screen.innerText = window.calcStr;
}
</script>
</body>
</html>
